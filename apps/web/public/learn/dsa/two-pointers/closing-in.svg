<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t">
<title id="t">A sorted row of numbers with pointers moving in from both ends; crossed-out cells are values already ruled out.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22C55E"/></marker>
<marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A1A1AA"/></marker></defs>
<rect width="800" height="320" rx="16" fill="#0B0B0D"/>
<text x="400" y="40" fill="#F5F5F7" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Two pointers: each step rules out a value for good</text>
<text x="400" y="66" fill="#A1A1AA" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle">target 10</text>
<rect x="164" y="96" width="72" height="72" rx="10" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="200" y="139" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="20" font-weight="400" text-anchor="middle">1</text><line x1="174" y1="158" x2="226" y2="106" stroke="#84848D" stroke-width="2"/>
<text x="200" y="188" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle">0</text>
<rect x="244" y="96" width="72" height="72" rx="10" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="280" y="139" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="20" font-weight="400" text-anchor="middle">2</text><line x1="254" y1="158" x2="306" y2="106" stroke="#84848D" stroke-width="2"/>
<text x="280" y="188" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle">1</text>
<rect x="324" y="96" width="72" height="72" rx="10" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="360" y="139" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="20" font-weight="400" text-anchor="middle">4</text>
<text x="360" y="188" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle">2</text>
<rect x="404" y="96" width="72" height="72" rx="10" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="440" y="139" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="20" font-weight="400" text-anchor="middle">5</text>
<text x="440" y="188" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle">3</text>
<rect x="484" y="96" width="72" height="72" rx="10" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="520" y="139" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="20" font-weight="400" text-anchor="middle">7</text>
<text x="520" y="188" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle">4</text>
<rect x="564" y="96" width="72" height="72" rx="10" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="600" y="139" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="20" font-weight="400" text-anchor="middle">11</text><line x1="574" y1="158" x2="626" y2="106" stroke="#84848D" stroke-width="2"/>
<text x="600" y="188" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="middle">5</text>
<line x1="360" y1="238" x2="360" y2="198" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360" y="258" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle">lo →</text>
<line x1="520" y1="238" x2="520" y2="198" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="258" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="14" font-weight="400" text-anchor="middle">← hi</text>
<text x="400" y="286" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">4 + 7 = 11 > 10, so move hi left</text>
</svg>
