<text x="472" y="284" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="400" text-anchor="middle">prev</text>
<text x="612" y="284" fill="#A1A1AA" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="400" text-anchor="middle">cur</text>
</svg>
