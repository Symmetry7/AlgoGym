<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t">
<title id="t">Seven booking bars on a timeline. The four that end earliest without overlapping, 1–3, 3–6, 6–8 and 8–11, are highlighted; the others overlap them.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22C55E"/></marker>
<marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A1A1AA"/></marker></defs>
<rect width="800" height="320" rx="16" fill="#0B0B0D"/>
<text x="400" y="36" fill="#F5F5F7" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Greedy: always take the booking that ends first</text>
<rect x="130" y="70" width="180" height="20" rx="6" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="318" y="85" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">0–4</text>
<rect x="176" y="100" width="88" height="20" rx="6" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="272" y="115" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">1–3</text>
<rect x="268" y="130" width="134" height="20" rx="6" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="410" y="145" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">3–6</text>
<rect x="314" y="160" width="226" height="20" rx="6" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="548" y="175" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">4–9</text>
<rect x="406" y="190" width="88" height="20" rx="6" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="502" y="205" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">6–8</text>
<rect x="498" y="220" width="134" height="20" rx="6" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="640" y="235" fill="#22C55E" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">8–11</text>
<rect x="360" y="250" width="318" height="20" rx="6" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="686" y="265" fill="#84848D" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">5–12</text>
<text x="400" y="302" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Sorted by end time: 1–3, 3–6, 6–8 and 8–11 fit; the rest overlap</text>
</svg>
