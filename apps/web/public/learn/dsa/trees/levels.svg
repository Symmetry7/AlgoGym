<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t">
<title id="t">A binary tree with root 8, children 3 and 10, and grandchildren 1, 6 and 14, grouped into three dashed bands labelled level 0, level 1 and level 2.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22C55E"/></marker>
<marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A1A1AA"/></marker></defs>
<rect width="800" height="320" rx="16" fill="#0B0B0D"/>
<text x="400" y="36" fill="#F5F5F7" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">A tree, one level at a time</text>
<rect x="120" y="52" width="560" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 6"/><text x="108" y="85" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">level 0</text>
<rect x="120" y="122" width="560" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 6"/><text x="108" y="155" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">level 1</text>
<rect x="120" y="197" width="560" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 6"/><text x="108" y="230" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">level 2</text>
<line x1="400" y1="102" x2="270" y2="128" stroke="#84848D" stroke-width="1.5"/>
<line x1="400" y1="102" x2="530" y2="128" stroke="#84848D" stroke-width="1.5"/>
<line x1="270" y1="172" x2="200" y2="203" stroke="#84848D" stroke-width="1.5"/>
<line x1="270" y1="172" x2="340" y2="203" stroke="#84848D" stroke-width="1.5"/>
<line x1="530" y1="172" x2="600" y2="203" stroke="#84848D" stroke-width="1.5"/>
<circle cx="400" cy="80" r="22" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/>
<text x="400" y="86" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="middle">8</text>
<circle cx="270" cy="150" r="22" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="270" y="156" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="middle">3</text>
<circle cx="530" cy="150" r="22" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="530" y="156" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="middle">10</text>
<circle cx="200" cy="225" r="22" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="200" y="231" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="middle">1</text>
<circle cx="340" cy="225" r="22" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="340" y="231" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="middle">6</text>
<circle cx="600" cy="225" r="22" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<text x="600" y="231" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="15" font-weight="400" text-anchor="middle">14</text>
<text x="400" y="292" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Breadth-first search visits level 0, then all of level 1, then level 2</text>
</svg>
