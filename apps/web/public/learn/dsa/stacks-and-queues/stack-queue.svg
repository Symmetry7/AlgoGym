<rect x="150" y="154" width="170" height="40" rx="10" fill="#1A1A1D" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><text x="235" y="180" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="18" font-weight="400" text-anchor="middle">7</text>
<rect x="150" y="106" width="170" height="40" rx="10" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/><text x="235" y="132" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="18" font-weight="400" text-anchor="middle">5</text>
<line x1="366" y1="126" x2="328" y2="126" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)"/>
<text x="372" y="131" fill="#22C55E" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">push / pop</text>
