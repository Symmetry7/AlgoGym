<text x="584" y="76" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">queue</text>
<rect x="440" y="150" width="64" height="64" rx="10" fill="rgba(34,197,94,0.14)" stroke="#22C55E" stroke-width="1.5"/><text x="472" y="189" fill="#F5F5F7" font-family="Geist Mono, ui-monospace, Consolas, Menlo, monospace" font-size="18" font-weight="400" text-anchor="middle">4</text>
