<rect width="800" height="320" rx="16" fill="#0B0B0D"/>
<text x="400" y="40" fill="#F5F5F7" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Stack: last in, first out. Queue: first in, first out.</text>
<text x="235" y="76" fill="#A1A1AA" font-family="Hanken Grotesk, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">stack</text>
